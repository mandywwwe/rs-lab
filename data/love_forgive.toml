background: home
narration: 
{{character.backstory}}
This is Feb 15th, 1929. In your dimly lit office, the morning paper's headline blares of a brutal shooting in the city's outskirts, its details unsettlingly vague and ominous. Yesterday, seven people were gunned down in a grimy garage on XX Road, identified as members of a notorious gangster syndicate.

Just as you contemplate the unsettling case, the office door swings open with a jarring creak. A woman bursts in, her pale face streaked with tears that glint in the dim light like dew on a spider's web. Her voice trembles with urgency and a hint of something primal. "Please," she implores, "they took Max... said he's evidence. He's all I have left since Edward... Please, you have to help me bring him back." Her desperate plea fills the room, mingling with the eerie atmosphere that now clings to your office like a veil of mist from some otherworldly realm.

You realize she's the wife of the victim, thinking about your reaction.
