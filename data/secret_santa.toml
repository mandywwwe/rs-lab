    "If player investigate public records, player will find discrepancies and unanswered questions in the reports that suggest a cover-up (need a 'normal' 'library_use' skill check).",
    "If player asks about Emily in the phone call, the operator will hold himself back. But a successful 'hard' 'psychology' skill check will make the operator reveal he saw Emily before.",
    "If player searches for Emily's journal, it is mentioned a chance encounter with Edgar Whitlock and the sense of foreboding that had haunted her before her disappearance (need a 'normal' 'spot_hidden' skill check).",
    "If player asks the locals, strange occurrences and ancient curses tied to the estate, hinting at a deeper, darker history (need a 'normal' 'fast_talk' or 'charm' or 'persuade' or 'disguise' skill check).",
    "Player needs to do skill check at least 3 times in this chapter. Skills can be chosen from 'persuade', 'fast_talk', 'charm', 'disguise', 'library_use', 'spot_hidden', 'credit_rating', 'listen', 'locksmith'.",
