]
initial="""
background: home
narration: 
{{character.backstory}}
On a cold December morning, as you perused the local newspaper over a cup of steaming coffee, a prominent notice caught your eye. Printed in bold, attention-grabbing font, it read:

"Invitation to a Grand Fundraising Banquet at Frosthaven Lodge. Join us for an evening of elegance and philanthropy at Frosthaven Lodge on Dec. 24th.
Please bring a gift of personal significance for our Secret Santa exchange.
Contact us at 555-1234 for inquiries and reservations. —Arkham Cove Museum Committee"

The mention of 'Arkham Cove' sent a shiver down your spine. You're decide to...

choices:
1. Investigate public records about Arkham Cove and its Museum.
2. Call the Museum, ask about the Secret Santa exchange.
3. Check Emily's journal for related information.
4. Go to Arkham Cove, ask locals about Frosthaven Lodge.
"""

