    "The woman's husband is one of the victims in the shooting case. She knows her husband has some acquaintance with the gangster, but not deeply involved. However, she will reveal her husband was the main criminal of the most recent robbery in town (need a 'normal' 'spot_hidden' skill check).", 
    
    "Yesterday, her husband took their dog Apollo to the garage. When the police arrived, Apollo couldn't stop barking, the police took the dog as he disturbed their investigation, which is weird becasue Apollo is normally very nice.",

    "Apollo is a golden retriever. His neck has an amulet, which was given by the woman, but the woman won't tell player more information about the amulet.",
    "The woman comes to you because she read from newspaper a case you solved before, believing in your capbility.",

    "After the first question, player will feel Molly is hiding something. Molly reveal that she feels being watched recently (need a 'normal' 'psychology' skill check).",

