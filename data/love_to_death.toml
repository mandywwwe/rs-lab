initial="""
background: investigator room
narration: 
{{character.backstory}}
February 15th, 1929. In your dimly lit office, the morning paper's headline blares of a brutal shooting on Beverly Street. Seven members of a notorious gangster syndicate were gunned down in a grimy garage. The details are unsettlingly vague and ominous.

As you contemplate the case, the office door swings open with a jarring creak. A woman bursts in, her pale face streaked with tears that glint in the dim light like dew on a spider's web. Her voice trembles with urgency. "Please," she implores, "they took Apollo... He's all I have left since Edward... Please, you have to help me bring him back."

You realize she's the wife of one of the victims and consider your next move.

choices:
1. Ask her about the identity of her husband.
2. Ask the reason why the police took Apollo.
3. Inspect if she's telling the truth.
4. Cautiously ask how she finds you.
"""

